# fly.toml app configuration file generated for leetcode-mcp-server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "leetcode-mcp-server"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  LEETCODE_SITE = "global"
  LEETCODE_TRANSPORT = "http"
  LEETCODE_HTTP_HOST = "0.0.0.0"
  LEETCODE_HTTP_PORT = "8080"
  LEETCODE_HTTP_ENDPOINT = "/mcp"
  # Fly's edge proxy is one hop in front of the app; needed for per-IP rate limits.
  LEETCODE_HTTP_TRUST_PROXY = "1"
  # Public URL used as the OAuth issuer. Change it if you use a different app name.
  # OAuth itself only turns on when the LEETCODE_OAUTH_PASSWORD secret is set.
  LEETCODE_OAUTH_ISSUER_URL = "https://leetcode-mcp-server.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
